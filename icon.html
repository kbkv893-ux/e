<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የወጪ ደብተር - አዶ ማዘጋጃ (Icon Maker)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a237e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .icon-container {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            border-radius: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 8px solid #fff;
            text-align: center;
        }
        .icon-emoji {
            font-size: 110px;
            margin-bottom: 5px;
        }
        .icon-text {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .btn {
            margin-top: 30px;
            background: #ff8f00;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .btn:hover {
            background: #ffa000;
        }
    </style>
</head>
<body>

    <h2>የአፕሊኬሽን አዶ (App Icon Preview)</h2>
    
    <!-- የሚለወጠው እና የሚቀረጸው የአዶ ክፍል -->
    <div class="icon-container" id="appIcon">
        <div class="icon-emoji">💰</div>
        <div class="icon-text">ወጪ</div>
    </div>

    <button class="btn" onclick="alert('ይህንን ንድፍ ስክሪንሾት (Screenshot) በማድረግ ወይም በፋይል መልክ በመጠቀም 192 እና 512 ፕክሰል በማድረግ GitHub ላይ ማስገባት ይችላሉ!')">መመሪያ ለማየት</button>

</body>
</html>
