<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የወጪ ደብተር - የፋይናንስ አስተዳደር</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- የሎጊን / ምዝገባ ገጽ -->
    <div id="authContainer" class="auth-wrapper">
        <div class="auth-card">
            <h2>💰 የወጪ ደብተር</h2>
            <p id="authSubtitle" style="color: #666; font-size: 14px; margin-bottom: 15px; text-align: center;">እባክዎ ይግቡ</p>
            
            <div class="form-group">
                <input type="text" id="authUsername" placeholder="የተጠቃሚ ስም (Username)">
            </div>
            <div class="form-group">
                <input type="password" id="authPassword" placeholder="የይለፍ ቃል (Password)">
            </div>
            <!-- ለምዝገባ ብቻ የሚያገለግል የፓስወርድ ማረጋገጫ -->
            <div class="form-group" id="confirmPasswordGroup" style="display: none;">
                <input type="password" id="authConfirmPassword" placeholder="የይለፍ ቃል ያረጋግጡ (Confirm Password)">
            </div>

            <button class="btn" id="authBtn" onclick="handleAuth()">ይግቡ</button>
            <p id="authToggleText" style="margin-top: 15px; font-size: 13px; color: #1A237E; cursor: pointer; text-align: center;" onclick="toggleAuthMode()">አካውንት የለዎትም? ይመዝገቡ</p>
        
            <!-- About Section በሎጊን ስር -->
            <div style="margin-top: 25px; border-top: 1px dashed #ddd; padding-top: 10px; text-align: center;">
                <p style="font-size: 11px; color: #888; margin: 0;">ስለ አፑ: <b>Expense Tracker v2.0</b></p>
                <p style="font-size: 11px; color: #888; margin: 3px 0 0 0;">የግል ካፒታል እና ወጪ መቆጣጠሪያ ስርዓት</p>
            </div>
        </div>
    </div>

    <!-- ዋናው የአፕሊኬሽን ገጽ -->
    <div id="appContainer" class="container" style="display: none;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 class="title" style="margin: 0;">💳 የወጪ ደብተር</h1>
            <button onclick="logout()" style="background: #d32f2f; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 13px;">ውጣ (Logout)</button>
        </div>

        <!-- ካፒታል ማስገቢያ -->
        <div class="card">
            <h2>የካፒታል መጠን</h2>
            <div class="form-group">
                <input type="number" id="capitalInput" placeholder="መነሻ ካፒታል (ብር)">
            </div>
            <button class="btn" onclick="setCapital()">ካፒታል አስቀምጥ</button>
            
            <div class="summary-info">
                <span>ጠቅላላ ካፒታል: <b id="displayCapital" style="color: #1A237E;">0</b> ብር</span>
                <span>ቀሪ ገንዘብ: <b id="displayRemaining" style="color: #1B5E20;">0</b> ብር</span>
            </div>
        </div>

        <!-- አዲስ ወጪ መመዝገቢያ -->
        <div class="card">
            <h2>አዲስ ወጪ መመዝገቢያ</h2>
            <div class="form-group">
                <input type="date" id="expenseDate">
            </div>
            <div class="form-group">
                <input type="number" id="expenseAmount" placeholder="መጠን (ብር)">
            </div>
            <div class="form-group">
                <input type="text" id="expenseReason" placeholder="ለምን ምክንያት ወጣ?">
            </div>
            <button class="btn" onclick="addExpense()">ወጪ ጨምር</button>
        </div>

        <!-- የወጪዎች ዝርዝር ሰንጠረዥ -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ቀን</th>
                        <th>መጠን</th>
                        <th>ምክንያት</th>
                        <th>ቀሪ</th>
                        <th>ድርጊት</th>
                    </tr>
                </thead>
                <tbody id="expenseTableBody">
                    <!-- ወጪዎች እዚህ ይገባሉ -->
                </tbody>
            </table>
        </div>

        <!-- ያለፉ ፎልደሮች (Archives) ማሳያ -->
        <div class="card" style="margin-top: 20px; border-top-color: #d32f2f;">
            <h2>ያለፉ የካፒታል ፎልደሮች (Archives History)</h2>
            <div id="archivesContainer">
                <p style="font-size: 14px; color: #666;">ገና የተዘጋ ፎልደር የለም።</p>
            </div>
        </div>

        <!-- የውስጥ አፕ About Footer -->
        <div style="text-align: center; margin-top: 30px; color: #778; font-size: 12px;">
            <p>Expense Tracker App &copy; 2026 | ደህንነቱ የተጠበቀ የፋይናንስ ረዳት</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
